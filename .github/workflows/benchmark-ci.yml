name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies (CPU)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy Pillow rich pytest

      - name: Unit tests
        run: python -m pytest

      - name: End-to-end smoke test (ResNet50, CPU, through the orchestrator)
        run: |
          python benchmark.py --framework pytorch --model resnet50 --precision fp32 --batch_size 1 \
            --device cpu --num_runs 3 --num_warmup 1 --output_dir benchmark_results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmark_results/
          retention-days: 30
